# Lives in the Redline source repo. Distributes standards, the readiness-gate caller and
# the PR template to onboarded repos as pull requests — never as direct pushes.
#
# DISABLED as of redline v3 Phase 1: scripts/sync.sh was deleted with no CLI replacement.
# `redline sync` is a control-plane command that ships in Phase 3 alongside telemetry —
# see CHANGELOG.md. The job below is left in place, gated off, so Phase 3 has a shape to
# rewire rather than rebuilding this from nothing.
#
# Targets and their profiles were listed in sync-targets.txt, now deleted; Phase 3 needs a
# register that `redline init` actually writes.
name: Redline Sync

on:
  push:
    branches: [main]
    paths:
      - 'standards/**'
      - 'scripts/render-self.mjs'
      - 'templates/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Render and diff without opening pull requests
        type: boolean
        default: false
      only:
        description: Sync a single repo by name
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: redline-sync
  cancel-in-progress: false

jobs:
  sync:
    # Dead in Phase 1: the "Open sync pull requests" step below still calls the deleted
    # scripts/sync.sh. Left in place, not deleted, purely as the shape to rewire once
    # `redline sync` ships in Phase 3 — see the DISABLED note above and CHANGELOG.md.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify rendered artifacts in this repo are current
        run: node scripts/render-self.mjs --check

      - name: Open sync pull requests
        env:
          # Fine-grained PAT or GitHub App installation token. Required permissions on
          # every target repo: contents:write, pull_requests:write, workflows:write.
          # Without `workflows` the push of .github/workflows/redline.yml is rejected.
          GH_TOKEN: ${{ secrets.REDLINE_SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY: ${{ inputs.dry-run && '--dry-run' || '' }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=()
          [[ -n "$DRY" ]] && args+=("$DRY")
          [[ -n "$ONLY" ]] && args+=(--only "$ONLY")
          bash scripts/sync.sh ${args[@]+"${args[@]}"}

      - name: Summarise
        if: always()
        run: echo "Sync finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
