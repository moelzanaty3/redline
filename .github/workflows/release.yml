name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Proves the pinned release toolchain resolves from the lockfile on every
  # same-repo PR. It proves no more than that: semantic-release detects the PR
  # context and exits 0 before verifyConditions, so no credentials are checked and
  # none are provided. Fork PRs are skipped entirely. The full publish path is
  # rehearsed by the workflow_dispatch canary job below.
  dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Resolve pinned release toolchain (dry run, exits early on PRs)
        run: npx semantic-release --dry-run

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # @semantic-release/github's `fail` step opens an issue when a release fails.
      # Without this it throws "Resource not accessible by integration" ON TOP of the
      # real error, burying the cause that actually needs reading.
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `registry-url`. It writes an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token in the environment that
      # expands to an empty string — which npm reports as a missing or invalid
      # token rather than falling through to OIDC. Trusted publishing needs no
      # .npmrc at all: the credential is the short-lived id-token below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 22 bundles npm 10.9.x. Trusted publishing needs npm >= 11.5.1, so the
      # bundled client cannot do it — it fails looking for a token that no longer
      # exists.
      # Pinned to the 11 line, not @latest. Trusted publishing needs npm >= 11.5.1
      # and Node 22 bundles 10.9.x, so an upgrade is required — but npm 12 already
      # refuses Node 22.22.0 and a future major could drop the Node 22 line
      # entirely, breaking releases with no change on our side. 11.x supports
      # Node 22 and clears the OIDC floor.
      - name: Upgrade npm to a version that speaks OIDC
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version

      - run: npm ci

      # Nothing has ever been published. With no v* tag semantic-release treats this
      # as a first release and computes 1.0.0 — a number this project has not earned
      # and cannot walk back once npm has it. Seeding v0.0.0 once anchors the line at
      # zero, so the first published version is 0.0.1 from a fix: commit (or 0.1.0
      # from a feat:), which is what CHANGELOG.md says it will be.
      #
      # The anchor goes on the commit the release line starts FROM, not on the root
      # commit: everything before the anchor is unreleased history, and this repo's
      # unreleased history carries dozens of feat: commits that would compute 0.1.0.
      - name: First-release guard
        run: |
          set -euo pipefail
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "::error::No v* tag exists — semantic-release would publish 1.0.0, not the 0.0.1 CHANGELOG.md declares."
            echo "::error::Anchor the release line at zero once, then re-run this workflow:"
            echo "::error::  git tag v0.0.0 <the commit the release line starts from> && git push origin v0.0.0"
            exit 1
          fi

      # standards/manifest.json is NOT stamped from the npm version here: the
      # standards line and the npm package line are separate, and AGENTS.md
      # requires a human to bump the manifest in the same PR as the rule change.
      - name: Gate before publish
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          node scripts/assign-rule-ids.mjs --check
          node scripts/validate.mjs
          node scripts/render-self.mjs --check
      # No NPM_TOKEN, deliberately. Authentication is OIDC trusted publishing:
      # `id-token: write` above lets the job mint a short-lived credential that npm
      # exchanges for publish rights, so there is no long-lived secret to leak or
      # rotate. Setting an empty NPM_TOKEN here would actively break it — npm reads
      # the empty value and reports a missing token instead of using OIDC.
      #
      # Provenance is off because it cannot work here: npm does not generate
      # attestations for private source repositories even when the package is
      # public, and @semantic-release/npm turns provenance ON by default under OIDC.
      # Left at its default, every publish would fail trying to attest a repository
      # npm cannot see. Turn this back on if the repository is ever made public.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'
        run: npx semantic-release

  # Manual rehearsal of the publish path: pushes a throwaway version to the
  # `canary` dist-tag so `latest` — what every onboarded repo installs — is untouched.
  canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to the 11 line, not @latest. Trusted publishing needs npm >= 11.5.1
      # and Node 22 bundles 10.9.x, so an upgrade is required — but npm 12 already
      # refuses Node 22.22.0 and a future major could drop the Node 22 line
      # entirely, breaking releases with no change on our side. 11.x supports
      # Node 22 and clears the OIDC floor.
      - name: Upgrade npm to a version that speaks OIDC
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version

      - run: npm ci

      # Same OIDC path as the release job — the trusted publisher is configured
      # against this workflow file, so both jobs in it can publish without a token.
      - name: Publish canary
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          # `g` prefix keeps an all-digit sha from becoming a numeric prerelease
          # identifier with a leading zero (invalid semver); run attempt keeps a
          # re-run from colliding with the version its first attempt published.
          npm version --no-git-tag-version "0.0.0-canary.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.g$(git rev-parse --short HEAD)"
          npm publish --tag canary
