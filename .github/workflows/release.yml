name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # standards/manifest.json is NOT stamped from the npm version here: the
      # standards line and the npm package line are separate, and AGENTS.md
      # requires a human to bump the manifest in the same PR as the rule change.
      - name: Gate before publish
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          node scripts/assign-rule-ids.mjs --check
          node scripts/validate.mjs
          node scripts/render-self.mjs --check

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes semantic-release
