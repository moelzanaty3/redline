# CI for the Redline bundle itself. This repo enforces standards on hundreds of others;
# a broken workflow or a stale rendered artifact here propagates everywhere.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The published package runs from dist/: Node refuses to type-strip .ts
      # under node_modules, so a broken emit means a broken install.
      - name: Build the published output
        run: npm run build

      - name: Every rule carries an id
        run: node scripts/assign-rule-ids.mjs --check

      - name: Bundle invariants
        run: node scripts/validate.mjs

      - name: Rendered artifacts are current
        run: node scripts/render-self.mjs --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tgz actionlint
          # workflows/ holds files destined for other repos, so actionlint is pointed at
          # them explicitly rather than relying on its .github/workflows discovery.
          ./actionlint -color .github/workflows/*.yml workflows/*.yml templates/redline.yml

      - name: JSON is parseable
        run: |
          set -euo pipefail
          for file in standards/manifest.json rulesets/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$file"
            echo "ok $file"
          done

      - name: Node scripts parse
        run: |
          set -euo pipefail
          for file in scripts/*.mjs; do
            node --check "$file"
            echo "ok $file"
          done

  web:
    # The documentation site reads standards/manifest.json, the rule catalogue and
    # scripts/lib/rules.mjs at build time, so a change to any of those can break it —
    # and nothing here noticed until this job existed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: web
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        # The install page resolves the published CLI version from the npm registry at
        # build time. It degrades to "could not check" rather than failing, so this job
        # does not go red on a registry outage — but pinning the registry off would hide
        # a real 404, so it is left to make the call itself.
        run: pnpm build

  pins:
    # Needs network, so it is its own job: a GitHub outage must not block the whole PR.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned actions still match their tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pins.mjs
